[package]
name = "sea-g2p-android"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Android/uniffi bindings for sea-g2p's pure-Rust G2P core (forked from pnnbao97/sea-g2p, vendoring its Apache-2.0 g2p/vi_normalizer/punc modules unmodified in logic)."

[lib]
name = "sea_g2p_android"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
regex = "1.10"
fancy-regex = "0.13"
once_cell = "1.19"
memmap2 = "0.9"
rayon = "1.10"
unicode-normalization = "0.1"
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1.0"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
